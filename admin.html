<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Momo's Palor</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="loader.css">
</head>

<body>
    <div class="page-loader" id="pageLoader">
        <img src="images/momob.png" alt="MOMO's PALOR">
        <div class="page-loader-ring"></div>
    </div>

    <header class="header">

        <div class="logo">
            <img src="images/momob.png" alt="Momo's Palor logo" width="100px" height="100px">

            <h2>MOMO'S PALOR</h2>
        </div>

        <h2 class="title">Admin Dashboard</h2>

        <button id="logout" type="button">Logout</button>

    </header>


    <main class="admin-page">

        <h1>Bookings</h1>
        <button id="refreshBookings" type="button">
            Refresh Bookings
        </button>


        <!-- Search bookings -->

        <div class="booking-search">

            <input type="text" id="bookingSearch" placeholder="Search by name or reference...">

        </div>

        <div class="booking-filter">
            <select id="statusFilter">
                <option value="all">All Bookings</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>

            <label class="hide-done-label">
                <input type="checkbox" id="hideDone">
                Hide completed &amp; cancelled
            </label>
        </div>


        <!-- Booking statistics -->

        <div class="booking-stats">

            <div class="stat-card">
                <h3>Total</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <p id="confirmedBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Cancelled</h3>
                <p id="cancelledBookings">0</p>
            </div>

            <div class="stat-card revenue-card">
                <h3>Revenue (This Month)</h3>
                <p id="monthRevenue">UGX 0</p>
            </div>

            <div class="stat-card revenue-card">
                <h3>Revenue (All Time)</h3>
                <p id="totalRevenue">UGX 0</p>
            </div>

        </div>



        <!-- Bookings will be created here by JavaScript -->

        <div id="bookingsList"></div>

        <section class="customers-page">
            <h1>Customers</h1>

            <div id="customersList"></div>
        </section>

        <section class="customer-history">
            <h1>Customer Booking History</h1>

            <div id="customerHistoryList"></div>
        </section>

        <section class="reset-password-section">
            <h1>Reset a Customer's Password</h1>
            <p>Ask the customer for their username, then set a new password for them.</p>

            <form id="resetPasswordForm">

                <input type="text" id="resetUsername" placeholder="Username" required>

                <div class="password-field">
                    <input type="password" id="resetNewPassword" placeholder="New password" required>
                    <button type="button" class="toggle-password" data-target="resetNewPassword"
                        aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit">Reset Password</button>

            </form>

            <p id="resetPasswordMessage"></p>
        </section>

    </main>


    <script src="loader.js"></script>
    <script src="logout.js"></script>
    <script src="script.js"></script>
    <script src="admin.js"></script>

</body>

</html>
